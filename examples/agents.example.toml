# Example a-team agent registry.
# Save your real one to ~/.config/a-team/agents.toml.
#
# Order in this file = order in the picker.
# Agents with the same `category` are grouped together.

[[agent]]
name = "Tasks"
path = "/Users/you/Documents/tasks"
kind = "persistent"
category = "Personal"

[[agent]]
name = "Toolkit"
path = "/Users/you/Documents/toolkit"
kind = "persistent"
category = "Personal"

[[agent]]
name = "Webapp"
path = "/Users/you/code/webapp"
kind = "persistent"
category = "Work"

[[agent]]
name = "API"
path = "/Users/you/code/api"
category = "Work"
# Only agents with boot = true come back after a reboot (`a-team all`).
boot = true

[[agent]]
name = "scratch"
path = "/Users/you/Documents/scratch"
